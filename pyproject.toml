[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "binance-universe"
version = "1.0.0"
description = "Binance crypto perpetual universe engine — discovery, ranking, and snapshot persistence"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-json-logger>=2.0",
    "anyio>=4.4",          # asyncio backend for httpx
    "websockets>=12.0",    # for order book streaming
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["universe*", "market_data*"]
